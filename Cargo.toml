[workspace]
resolver = "2"
members = ["crates/*", "tools/update"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.23"
authors = ["John Lose (joeMJ)"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
toml = "0.8"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
