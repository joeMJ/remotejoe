[package]
name = "remotejoe-plugin-api"
description = "Schnittstelle zwischen dem Kern von remotejoe und seinen Erweiterungen (Plugins): Host-Operationen, Plugin-Anschlussstellen, gemeinsame Typen"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "rj_plugin_api"

[features]
# Seite des Kerns: Bibliotheken laden (libloading).
host = ["dep:libloading"]

[dependencies]
libloading = { version = "0.8", optional = true }
remotejoe-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
