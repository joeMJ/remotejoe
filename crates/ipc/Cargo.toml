[package]
name = "remotejoe-ipc"
description = "Nachrichten zwischen Oberfläche und Workern, Bildübertragung über geteilten Speicher"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "rj_ipc"

[dependencies]
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true
uuid.workspace = true
postcard = { version = "1", features = ["use-std"] }
memmap2 = "0.9"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }
