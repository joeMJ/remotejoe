[package]
name = "remotejoe-worker-rdp"
description = "RDP-Worker auf Grundlage von FreeRDP 3"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
publish.workspace = true
links = "freerdp3"

[lib]
name = "rj_rdp"

[[bin]]
name = "rj-worker-rdp"
path = "src/main.rs"

[dependencies]
remotejoe-core = { path = "../core" }
remotejoe-ipc = { path = "../ipc" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
zeroize.workspace = true

[build-dependencies]
cc = "1"
bindgen = "0.72"
pkg-config = "0.3"

[dev-dependencies]
md4 = "0.10"
remotejoe-testkit = { path = "../testkit" }
remotejoe-supervisor = { path = "../supervisor" }
tempfile.workspace = true
base64 = "0.22"
libc = "0.2"
