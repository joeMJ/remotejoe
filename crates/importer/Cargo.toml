[package]
name = "remotejoe-importer"
description = "Import aus Remote Desktop Manager und Royal TS, Export als JSON oder CSV"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "rj_importer"

[dependencies]
remotejoe-core = { path = "../core" }
remotejoe-kdbx = { path = "../kdbx" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
quick-xml = "0.42"
zeroize.workspace = true
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto"] }

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto"] }
tempfile.workspace = true
