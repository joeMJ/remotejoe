[package]
name = "remotejoe-ui"
description = "Qt-Oberfläche"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "rj_ui"

[[bin]]
name = "remotejoe"
path = "src/main.rs"

[dependencies]
zeroize.workspace = true
remotejoe-core = { path = "../core" }
remotejoe-kdbx = { path = "../kdbx" }
remotejoe-ipc = { path = "../ipc" }
remotejoe-supervisor = { path = "../supervisor" }
remotejoe-worker-ssh = { path = "../worker-ssh" }
remotejoe-tunnel = { path = "../tunnel" }
remotejoe-tasks = { path = "../tasks" }
remotejoe-importer = { path = "../importer" }
remotejoe-snmp = { path = "../snmp" }
remotejoe-worker-psrp = { path = "../worker-psrp" }
remotejoe-proxmox = { path = "../proxmox" }
remotejoe-update = { path = "../update" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time"] }
alacritty_terminal = "0.26"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", default-features = false }

[build-dependencies]
cxx-qt-build = "0.10"

[dev-dependencies]
tempfile.workspace = true
remotejoe-testkit = { path = "../testkit" }
# Testschalter im Worker (Absturz und Hänger des Emulators), nur für Testbauten.
remotejoe-worker-ssh = { path = "../worker-ssh", features = ["test-hooks"] }

# Hauptkennwort im Schlüsselbund des Systems (Linux: Secret Service über D-Bus, reines Rust; Windows: Anmeldeinformationsverwaltung).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
