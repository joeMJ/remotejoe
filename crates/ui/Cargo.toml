[package]
name = "remotejoe-ui"
description = "Qt-Oberfläche"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "rj_ui"

[[bin]]
name = "remotejoe"
path = "src/main.rs"

[dependencies]
remotejoe-core = { path = "../core" }
remotejoe-kdbx = { path = "../kdbx" }
remotejoe-ipc = { path = "../ipc" }
remotejoe-supervisor = { path = "../supervisor" }
remotejoe-worker-ssh = { path = "../worker-ssh" }
remotejoe-tunnel = { path = "../tunnel" }
remotejoe-tasks = { path = "../tasks" }
remotejoe-importer = { path = "../importer" }
remotejoe-snmp = { path = "../snmp" }
remotejoe-worker-psrp = { path = "../worker-psrp" }
remotejoe-proxmox = { path = "../proxmox" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
alacritty_terminal = "0.26"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", default-features = false }

[build-dependencies]
cxx-qt-build = "0.10"

[dev-dependencies]
tempfile.workspace = true
